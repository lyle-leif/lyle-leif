<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Neon orbit with LD monogram">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e97"/>
      <stop offset=".5" stop-color="#7928ca"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#7928ca" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#7928ca" stop-opacity=".12"/>
      <stop offset="1" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#core)">
    <animate attributeName="r" values="140;155;140" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- outer dashed ring -->
  <g filter="url(#glow)">
    <circle cx="160" cy="160" r="135" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-dasharray="4 10" opacity=".7">
      <animateTransform attributeName="transform" type="rotate" values="0 160 160;360 160 160" dur="40s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- tilted orbit 1 -->
  <g transform="rotate(-25 160 160)">
    <ellipse cx="160" cy="160" rx="118" ry="44" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity=".55" filter="url(#glow)"/>
    <circle r="6" fill="#00f0ff" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M42,160 a118,44 0 1,0 236,0 a118,44 0 1,0 -236,0"/>
    </circle>
  </g>

  <!-- tilted orbit 2 -->
  <g transform="rotate(35 160 160)">
    <ellipse cx="160" cy="160" rx="118" ry="44" fill="none" stroke="#ff2e97" stroke-width="1.5" opacity=".55" filter="url(#glow)"/>
    <circle r="5" fill="#ff2e97" filter="url(#glow)">
      <animateMotion dur="7s" repeatCount="indefinite" path="M278,160 a118,44 0 1,1 -236,0 a118,44 0 1,1 236,0"/>
    </circle>
  </g>

  <!-- vertical orbit -->
  <g transform="rotate(90 160 160)">
    <ellipse cx="160" cy="160" rx="100" ry="30" fill="none" stroke="#b388ff" stroke-width="1.2" opacity=".45" filter="url(#glow)"/>
    <circle r="4" fill="#b388ff" filter="url(#glow)">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M60,160 a100,30 0 1,0 200,0 a100,30 0 1,0 -200,0"/>
    </circle>
  </g>

  <!-- core hexagon + monogram -->
  <g filter="url(#glow)">
    <polygon points="160,112 201.6,136 201.6,184 160,208 118.4,184 118.4,136" fill="#0b0f17" stroke="url(#ring)" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" values="0 160 160;60 160 160" dur="6s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <text x="160" y="172" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-weight="700" font-size="34" fill="#ffffff" filter="url(#glow)">LD</text>
</svg>
