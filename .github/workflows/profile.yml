name: ✨ Refresh profile cards

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [.github/workflows/profile.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ── Stats cards (generated here, so they never hit public rate limits) ──
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true   # a hiccup keeps yesterday's card instead of an error card
        with:
          fail_on_error: true
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&border_radius=14&bg_color=0b0f17&title_color=ff2e97&icon_color=00f0ff&text_color=c9d1d9&ring_color=ff2e97&custom_title=Stats.exe
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true   # a hiccup keeps yesterday's card instead of an error card
        with:
          fail_on_error: true
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&langs_count=6&hide_border=true&border_radius=14&bg_color=0b0f17&title_color=00f0ff&text_color=c9d1d9&custom_title=Language%20Lab
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Contribution snake (dark + light) ──
      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#161b22,#3b1340,#6d1a5c,#b0207a,#ff2e97
            profile/snake-light.svg?palette=github-light&color_snake=#7928ca&color_dots=#ebedf0,#ffc2e0,#ff85c0,#ff4fa3,#ff2e97

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "chore: refresh profile cards" || exit 0
          git push
