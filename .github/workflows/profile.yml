name: ✨ Refresh profile cards

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [.github/workflows/profile.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ── Stats cards (generated here, so they never hit public rate limits) ──
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true   # a hiccup keeps yesterday's card instead of an error card
        with:
          fail_on_error: true
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&border_radius=14&bg_color=07020f&title_color=e0aaff&icon_color=c77dff&text_color=e6dcf5&ring_color=9d4edd&custom_title=Stats.exe
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true   # a hiccup keeps yesterday's card instead of an error card
        with:
          fail_on_error: true
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&langs_count=6&hide_border=true&border_radius=14&bg_color=07020f&title_color=c77dff&text_color=e6dcf5&custom_title=Language%20Lab
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@v1.8.0
        continue-on-error: true
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&border_radius=14&background=07020F&stroke=3C096C&ring=9D4EDD&fire=C77DFF&currStreakNum=FFFFFF&currStreakLabel=E0AAFF&sideNums=FFFFFF&sideLabels=E0AAFF&dates=8C7AA9
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Contribution snake (dark + light) ──
      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?palette=github-dark&color_snake=#e0aaff&color_dots=#120a24,#3c096c,#5a189a,#7b2cbf,#c77dff
            profile/snake-light.svg?palette=github-light&color_snake=#5a189a&color_dots=#ebedf0,#e0c3fc,#c77dff,#9d4edd,#7b2cbf

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "chore: refresh profile cards" || exit 0
          git push
